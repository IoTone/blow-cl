plugins {
    id 'java'
    id 'application'
}

group = 'org.iotone.blowcl'
version = '0.5.0'
description = 'blow-cl: the blow Lisp web framework, reborn on modern ABCL, Jetty, and Gradle'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

ext {
    abclVersion  = '1.9.2'
    jettyVersion = '11.0.24'
    slf4jVersion = '2.0.16'
}

dependencies {
    implementation "org.abcl:abcl:${abclVersion}"
    implementation "org.abcl:abcl-contrib:${abclVersion}"

    implementation "org.eclipse.jetty:jetty-server:${jettyVersion}"
    implementation "org.eclipse.jetty:jetty-servlet:${jettyVersion}"

    implementation "org.slf4j:slf4j-simple:${slf4jVersion}"
}

application {
    mainClass = 'org.blowcl.Main'
}

// Run the demo app: ./gradlew run
// Override the webapp with: ./gradlew run -Pwebapp=/path/to/your/app -Pport=9999
run {
    def webapp = project.findProperty('webapp') ?: "${projectDir}/demo/app"
    def port   = project.findProperty('port')   ?: '9999'
    systemProperty 'blowcl.webapp', webapp
    systemProperty 'blowcl.port', port
    systemProperty 'blowcl.lisp.home', "${projectDir}/src/main/lisp"
}

tasks.register('repl', JavaExec) {
    group = 'application'
    description = 'Start an ABCL REPL with the blow-cl classpath'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.armedbear.lisp.Main'
    standardInput = System.in
}
